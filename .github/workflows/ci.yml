name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npx astro check
      - run: npm test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' > supabase.env
      - name: Run database isolation suite
        run: |
          source supabase.env
          SUPABASE_URL="$API_URL" SUPABASE_KEY="$ANON_KEY" npm run test:db
      - name: Check generated database types are up to date
        run: npm run db:types && git diff --exit-code src/lib/database.types.ts
      # A deterministic all-clear forecast for the smoke test and the e2e spec. It must answer before the
      # build: preview reads the FORECAST_BASE_URL copied into dist/server/.dev.vars at build time.
      - name: Start forecast fixture
        run: |
          node tests/e2e/forecast-fixture.mjs &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:4400/v1/forecast && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:4400/v1/forecast
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\nFORECAST_BASE_URL=%s\n' "$API_URL" "$ANON_KEY" "http://127.0.0.1:4400" > .env
          cp .env .dev.vars
      - run: npm run build
      - name: Run smoke test against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          BASE_URL=http://localhost:4321 npm run smoke
      - run: npx playwright install --with-deps chromium
      - name: Run e2e spec against production preview
        run: BASE_URL=http://localhost:4321 npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup

  migrate:
    # Pushes new migrations to the hosted project only after ci and smoke pass on main.
    # `deploy` runs after this job, so the old code briefly runs against the new schema:
    # keep migrations backward-compatible with the code already live.
    needs: [ci, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Secrets live in the `production` environment (main-only), not repo-wide.
    environment: production
    concurrency: migrate
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref kzdovsrpyxhfduusaqlu
      - run: supabase db push

  deploy:
    # F-02: every merge to main deploys to Cloudflare Workers once ci, smoke and migrate have
    # passed; a failing job anywhere upstream blocks it. Manual `npx wrangler deploy` stays for
    # hotfixes only.
    needs: [migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Never cancel a deploy halfway; a newer merge waits for the running one.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      # Token: "Edit Cloudflare Workers" template, scoped to the account (environment secret).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Not a secret; an environment variable so wrangler never has to guess the account.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      LIVE_URL: https://sidereus.sidereus.workers.dev
    steps:
      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable in the production environment."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No Supabase values at build time: the Worker reads SUPABASE_URL / SUPABASE_KEY from its own
      # secrets at runtime (context/deployment/deploy-plan.md, step 5).
      - run: npm run build
      - run: npx wrangler deploy
      - name: Check the live site
        run: |
          for i in $(seq 1 10); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$LIVE_URL/")" = "200" ] && break
            sleep 3
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' "$LIVE_URL/")" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$LIVE_URL/tonight")" = "302 $LIVE_URL/auth/signin"
